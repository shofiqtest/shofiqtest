<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title description" font-family="Segoe UI, Arial, sans-serif">
  <title id="title">From board bring-up to application software</title>
  <desc id="description">A left-to-right map of Md Shofiqul Islam's work. Board and SoC hardware connects through alternative Embedded Linux and Zephyr RTOS platform paths to C and C++ libraries and real-time software, then to ROS 2 and Python services and applications. System design, integration, debugging and validation span every layer.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f9fc"/>
      <stop offset="1" stop-color="#eef4f8"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#102f49"/>
      <stop offset="1" stop-color="#145c63"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#16324a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#557387"/>
    </marker>
  </defs>

  <style>
    .mobile-flow { display: none; }
    @media (max-width: 700px) {
      .desktop-flow { display: none; }
      .mobile-flow { display: inline; }
    }
  </style>

  <rect width="1200" height="620" rx="20" fill="url(#background)"/>

  <g class="desktop-flow">

  <text x="32" y="44" font-size="29" font-weight="700" fill="#102a43">From board bring-up to application software</text>
  <text x="32" y="73" font-size="16" fill="#526779">How my embedded and systems work connects across the stack</text>
  <rect x="1011" y="28" width="157" height="34" rx="17" fill="#dcefe9"/>
  <text x="1089.5" y="50" text-anchor="middle" font-size="14" font-weight="700" fill="#116354">BOARD TO APP</text>

  <!-- Board and hardware -->
  <rect x="32" y="123" width="176" height="322" rx="14" fill="#ffffff" stroke="#b9cad7" filter="url(#shadow)"/>
  <rect x="32" y="123" width="8" height="322" rx="4" fill="#27689b"/>
  <circle cx="69" cy="161" r="21" fill="#e5f0f8"/>
  <path d="M59 153 H79 V169 H59 Z M55 157 H59 M55 163 H59 M55 169 H59 M79 157 H83 M79 163 H83 M79 169 H83" fill="none" stroke="#27689b" stroke-width="2" stroke-linecap="round"/>
  <text x="55" y="204" font-size="19" font-weight="700" fill="#173b5a">Board / SoC</text>
  <text x="55" y="230" font-size="19" font-weight="700" fill="#173b5a">and peripherals</text>
  <line x1="55" y1="251" x2="184" y2="251" stroke="#d6e0e8"/>
  <text x="55" y="281" font-size="15" fill="#40586b">Board bring-up</text>
  <text x="55" y="311" font-size="15" fill="#40586b">ARM / x86 SoCs</text>
  <text x="55" y="341" font-size="15" fill="#40586b">I2C, SPI, ADC</text>
  <text x="55" y="371" font-size="15" fill="#40586b">Interrupts, DMA</text>
  <text x="55" y="401" font-size="15" fill="#40586b">Hardware interfaces</text>

  <!-- Branch to alternative platform routes -->
  <path d="M208 284 H226 V191 H244" fill="none" stroke="#557387" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M226 284 V371 H244" fill="none" stroke="#557387" stroke-width="2.5" marker-end="url(#arrow)"/>

  <text x="388" y="111" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="1" fill="#667d8d">ALTERNATIVE PLATFORM PATHS</text>

  <!-- Embedded Linux route -->
  <rect x="248" y="129" width="280" height="144" rx="14" fill="#edf5fb" stroke="#9fbdd1" filter="url(#shadow)"/>
  <rect x="248" y="129" width="7" height="144" rx="3.5" fill="#27689b"/>
  <text x="271" y="163" font-size="20" font-weight="700" fill="#173b5a">Embedded Linux</text>
  <text x="271" y="193" font-size="15" fill="#36566f">U-Boot and Device Tree</text>
  <text x="271" y="218" font-size="15" fill="#36566f">Yocto / OpenEmbedded BSP</text>
  <text x="271" y="243" font-size="15" fill="#36566f">Kernel and device drivers</text>

  <!-- Zephyr route -->
  <rect x="248" y="309" width="280" height="144" rx="14" fill="#eaf6f2" stroke="#99c8ba" filter="url(#shadow)"/>
  <rect x="248" y="309" width="7" height="144" rx="3.5" fill="#15806b"/>
  <text x="271" y="343" font-size="20" font-weight="700" fill="#11594d">Zephyr RTOS</text>
  <text x="271" y="373" font-size="15" fill="#32675d">Sensor interfaces and drivers</text>
  <text x="271" y="398" font-size="15" fill="#32675d">MAX30102 support</text>
  <text x="271" y="423" font-size="15" fill="#32675d">INA237 triggered-mode fix</text>

  <!-- Platform routes merge into common software -->
  <path d="M528 201 H545 V284 H562" fill="none" stroke="#557387" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M528 381 H545 V284" fill="none" stroke="#557387" stroke-width="2.5"/>

  <!-- Shared C/C++ layer -->
  <rect x="566" y="166" width="218" height="237" rx="14" fill="#ffffff" stroke="#b9cad7" filter="url(#shadow)"/>
  <circle cx="598" cy="200" r="18" fill="#e6eef7"/>
  <text x="598" y="206" text-anchor="middle" font-size="13" font-weight="700" fill="#245c86">C/C++</text>
  <text x="589" y="239" font-size="19" font-weight="700" fill="#173b5a">Libraries and</text>
  <text x="589" y="265" font-size="19" font-weight="700" fill="#173b5a">real-time software</text>
  <line x1="589" y1="286" x2="761" y2="286" stroke="#d6e0e8"/>
  <text x="589" y="312" font-size="15" fill="#40586b">Component interfaces</text>
  <text x="589" y="339" font-size="15" fill="#40586b">Signal processing</text>
  <text x="589" y="366" font-size="15" font-weight="600" fill="#2a536f">Nokia: channel estimation</text>
  <text x="589" y="389" font-size="14" fill="#526779">and real-time 5G RF/L1</text>

  <path d="M784 284 H808" fill="none" stroke="#557387" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Services -->
  <rect x="812" y="183" width="166" height="202" rx="14" fill="#f0f4fa" stroke="#afc1d0" filter="url(#shadow)"/>
  <circle cx="842" cy="216" r="17" fill="#dfe9f3"/>
  <path d="M834 216 H850 M842 208 V224" stroke="#356b91" stroke-width="2.4" stroke-linecap="round"/>
  <text x="834" y="255" font-size="19" font-weight="700" fill="#173b5a">Services</text>
  <line x1="834" y1="274" x2="956" y2="274" stroke="#d3dee7"/>
  <text x="834" y="305" font-size="15" fill="#40586b">ROS 2</text>
  <text x="834" y="333" font-size="15" fill="#40586b">Python / FastAPI</text>
  <text x="834" y="361" font-size="15" fill="#40586b">Data and APIs</text>

  <path d="M978 284 H1002" fill="none" stroke="#557387" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Applications -->
  <rect x="1006" y="183" width="162" height="202" rx="14" fill="#eaf6f2" stroke="#99c8ba" filter="url(#shadow)"/>
  <circle cx="1036" cy="216" r="17" fill="#d5ece5"/>
  <rect x="1028" y="209" width="16" height="13" rx="2" fill="none" stroke="#14705f" stroke-width="2"/>
  <path d="M1032 226 H1040" stroke="#14705f" stroke-width="2" stroke-linecap="round"/>
  <text x="1028" y="255" font-size="19" font-weight="700" fill="#11594d">Applications</text>
  <text x="1028" y="280" font-size="19" font-weight="700" fill="#11594d">and tools</text>
  <line x1="1028" y1="299" x2="1146" y2="299" stroke="#c6ded6"/>
  <text x="1028" y="330" font-size="15" fill="#32675d">Monitoring</text>
  <text x="1028" y="357" font-size="15" fill="#32675d">Engineering tools</text>

  <!-- Responsibilities spanning every layer -->
  <rect x="32" y="489" width="1136" height="101" rx="14" fill="url(#band)"/>
  <text x="56" y="522" font-size="14" font-weight="700" letter-spacing="1" fill="#9ed9cf">ACROSS EVERY LAYER</text>
  <text x="56" y="556" font-size="18" font-weight="700" fill="#ffffff">System design</text>
  <circle cx="230" cy="551" r="3" fill="#76b8b0"/>
  <text x="255" y="556" font-size="18" font-weight="700" fill="#ffffff">Integration</text>
  <circle cx="405" cy="551" r="3" fill="#76b8b0"/>
  <text x="430" y="556" font-size="18" font-weight="700" fill="#ffffff">Debugging</text>
  <circle cx="582" cy="551" r="3" fill="#76b8b0"/>
  <text x="607" y="556" font-size="18" font-weight="700" fill="#ffffff">Validation</text>
  <text x="752" y="555" font-size="15" fill="#d3e5e8">Interfaces, timing, failure handling and test evidence</text>
  </g>

  <!-- Simplified view selected by responsive SVG renderers on narrow screens -->
  <g class="mobile-flow">
    <text x="32" y="59" font-size="39" font-weight="700" fill="#102a43">Board-to-application software</text>
    <text x="32" y="94" font-size="22" fill="#526779">Embedded platforms, real-time software and services</text>

    <rect x="32" y="139" width="180" height="246" rx="18" fill="#ffffff" stroke="#9fb7c8" stroke-width="2"/>
    <rect x="32" y="139" width="9" height="246" rx="4.5" fill="#27689b"/>
    <text x="59" y="206" font-size="29" font-weight="700" fill="#173b5a">Board / SoC</text>
    <text x="59" y="244" font-size="29" font-weight="700" fill="#173b5a">and peripherals</text>
    <text x="59" y="301" font-size="22" fill="#40586b">Bring-up</text>
    <text x="59" y="337" font-size="22" fill="#40586b">Hardware I/O</text>

    <path d="M212 262 H245" fill="none" stroke="#557387" stroke-width="4" marker-end="url(#arrow)"/>

    <rect x="251" y="139" width="250" height="246" rx="18" fill="#edf6f5" stroke="#8ebfb4" stroke-width="2"/>
    <text x="276" y="188" font-size="22" font-weight="700" letter-spacing="1" fill="#4b6c70">PLATFORM PATHS</text>
    <rect x="276" y="211" width="200" height="57" rx="12" fill="#dcebf7"/>
    <text x="376" y="248" text-anchor="middle" font-size="27" font-weight="700" fill="#173b5a">Embedded Linux</text>
    <text x="376" y="297" text-anchor="middle" font-size="22" font-weight="700" fill="#66808b">OR</text>
    <rect x="276" y="318" width="200" height="46" rx="12" fill="#d5ece5"/>
    <text x="376" y="349" text-anchor="middle" font-size="27" font-weight="700" fill="#11594d">Zephyr RTOS</text>

    <path d="M501 262 H534" fill="none" stroke="#557387" stroke-width="4" marker-end="url(#arrow)"/>

    <rect x="540" y="139" width="212" height="246" rx="18" fill="#ffffff" stroke="#9fb7c8" stroke-width="2"/>
    <text x="565" y="204" font-size="29" font-weight="700" fill="#173b5a">C / C++</text>
    <text x="565" y="242" font-size="29" font-weight="700" fill="#173b5a">real-time</text>
    <text x="565" y="280" font-size="29" font-weight="700" fill="#173b5a">software</text>
    <text x="565" y="337" font-size="21" fill="#40586b">Nokia 5G RF/L1</text>

    <path d="M752 262 H785" fill="none" stroke="#557387" stroke-width="4" marker-end="url(#arrow)"/>

    <rect x="791" y="139" width="170" height="246" rx="18" fill="#f0f4fa" stroke="#9fb7c8" stroke-width="2"/>
    <text x="816" y="211" font-size="29" font-weight="700" fill="#173b5a">Services</text>
    <text x="816" y="278" font-size="23" fill="#40586b">ROS 2</text>
    <text x="816" y="317" font-size="23" fill="#40586b">Python</text>
    <text x="816" y="356" font-size="23" fill="#40586b">FastAPI</text>

    <path d="M961 262 H994" fill="none" stroke="#557387" stroke-width="4" marker-end="url(#arrow)"/>

    <rect x="1000" y="139" width="168" height="246" rx="18" fill="#eaf6f2" stroke="#8ebfb4" stroke-width="2"/>
    <text x="1024" y="211" font-size="28" font-weight="700" fill="#11594d">Applications</text>
    <text x="1024" y="249" font-size="28" font-weight="700" fill="#11594d">and tools</text>
    <text x="1024" y="316" font-size="22" fill="#32675d">Monitoring</text>
    <text x="1024" y="353" font-size="22" fill="#32675d">Tooling</text>

    <rect x="32" y="435" width="1136" height="137" rx="18" fill="url(#band)"/>
    <text x="56" y="478" font-size="20" font-weight="700" letter-spacing="1.5" fill="#9ed9cf">ACROSS EVERY LAYER</text>
    <text x="56" y="535" font-size="28" font-weight="700" fill="#ffffff">System design</text>
    <text x="315" y="535" font-size="28" font-weight="700" fill="#ffffff">Integration</text>
    <text x="536" y="535" font-size="28" font-weight="700" fill="#ffffff">Debugging</text>
    <text x="758" y="535" font-size="28" font-weight="700" fill="#ffffff">Validation</text>
    <text x="950" y="535" font-size="21" fill="#d3e5e8">Timing and test evidence</text>
  </g>
</svg>
